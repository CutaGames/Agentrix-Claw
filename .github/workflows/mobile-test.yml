name: Mobile Tests (L1 + L2)

# L1 unit tests (jest) + L2 API smoke (node) — per
# docs/MOBILE_E2E_TESTING_2026-05.zh-CN.md.  Runs on mobile-only PRs and
# on every push to the sprint build branches so a stale constants file
# or a dropped plaza route never makes it into an APK.
#
# L3 Maestro flows are handled by the Agentrix-Claw APK build matrix.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'tsconfig.json'
      - 'scripts/test/**'
      - '.github/workflows/mobile-test.yml'
      # Cross-cut: backend constants that L1 tests parse
      - 'backend/src/modules/subscription/subscription.constants.ts'
      - 'backend/src/modules/axp/axp.constants.ts'
      - 'backend/src/modules/pet-greeting/pet-greeting.constants.ts'
  push:
    branches:
      - 'feature/**'
      - 'build*'
      - 'build/**'

concurrency:
  group: mobile-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l1-unit:
    name: L1 · Jest unit + navigation guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Jest (no coverage, CI reporter)
        run: npx jest --no-coverage --ci --reporters=default

  l2-smoke:
    name: L2 · Production API smoke (public endpoints)
    runs-on: ubuntu-latest
    needs: l1-unit
    timeout-minutes: 5
    # L2 only runs on sprint pushes (not PRs) because it hits the live
    # `api.agentrix.top` — no secrets needed for the public half, the
    # authed half is skipped when AGENTRIX_TOKEN isn't set.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref_name, 'build') || startsWith(github.ref_name, 'feature/'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Public API smoke
        env:
          AGENTRIX_API_BASE: https://api.agentrix.top/api
        run: node scripts/test/mobile-api-smoke.mjs
