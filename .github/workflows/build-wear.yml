name: Build Wear OS (thin-shell)

# 原生 Wear OS 薄壳独立构建 + 签名 + 体积门禁（>30MB 失败）+ 部署到下载服务器。
# 与手机 APK 相同的 Linux runner + JDK17 + Android SDK；无 Expo/Metro（原生 Kotlin，更简单）。
# 手动触发（私有仓 Actions 有额度限制，按需运行）。复用手机同一套签名 secrets。
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["build/**", "build*"]
    paths:
      - "wear/**"
      - ".github/workflows/build-wear.yml"

permissions:
  contents: write

jobs:
  build:
    name: ⌚ Build Wear OS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: wear
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper (jar not committed)
        run: gradle wrapper --gradle-version 8.9

      - name: Unit tests (JVM)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # ── Signing: reuse the SAME keystore secrets as the phone APK build ──
      - name: Setup release signing (if keystore secrets present)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
            {
              echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
              echo "MYAPP_UPLOAD_KEY_ALIAS=${KEY_ALIAS}"
              echo "MYAPP_UPLOAD_STORE_PASSWORD=${STORE_PASSWORD}"
              echo "MYAPP_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}"
            } >> gradle.properties
            echo "[ci] Keystore decoded — Wear APK will be signed"
          else
            echo "[ci] No ANDROID_KEYSTORE_BASE64 — building with debug signing (installable for testing)"
          fi

      - name: Assemble release (R8 + shrink + arm64)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Size gate (<30MB hard cap) + stage artifact
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          SIZE=$(stat -c%s "$APK")
          MB=$((SIZE / 1024 / 1024))
          echo "Release APK: $APK = ${MB}MB (${SIZE} bytes)"
          if [ "$SIZE" -gt $((30 * 1024 * 1024)) ]; then
            echo "::error::APK ${MB}MB exceeds 30MB hard cap"; exit 1
          fi
          mkdir -p artifacts
          cp "$APK" "artifacts/AgentrixWatch-build-${{ github.run_number }}.apk"

      # ── Deploy to download server (replaces the old 2026-03-31 RN package) ──
      - name: Check deploy secret
        id: deploy-check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_SSH_KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT";
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "[ci] no DEPLOY_SSH_KEY; skip deploy"; fi

      - name: Upload Wear APK to download server
        if: ${{ steps.deploy-check.outputs.enabled == 'true' }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          APK="artifacts/AgentrixWatch-build-${{ github.run_number }}.apk"
          echo "$DEPLOY_SSH_KEY" > /tmp/deploy.pem && chmod 600 /tmp/deploy.pem
          DEST="/home/ubuntu/Agentrix/frontend/public/downloads"
          OPTS="-o StrictHostKeyChecking=no -i /tmp/deploy.pem"
          ssh $OPTS ubuntu@47.130.176.148 \
            "cp ${DEST}/agentrix-watch.apk ${DEST}/agentrix-watch.apk.bak-\$(date +%Y%m%d-%H%M%S) 2>/dev/null || true"
          scp $OPTS "$APK" "ubuntu@47.130.176.148:${DEST}/agentrix-watch.apk"
          echo "✅ Deployed native Wear APK → agentrix-watch.apk"

      - name: Create GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: wear-${{ github.run_number }}
          name: "⌚ Agentrix Wear OS Build #${{ github.run_number }}"
          body: |
            原生 Wear OS 薄壳（Kotlin/Compose）。仅 Wear OS（Android 侧手表），非 Apple Watch。
            安装：Android 手机配对的 Wear OS 表，或 `adb install`。
          files: wear/artifacts/AgentrixWatch-build-${{ github.run_number }}.apk
          fail_on_unmatched_files: false

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AgentrixWatch-build-${{ github.run_number }}
          path: wear/artifacts/*.apk
          if-no-files-found: error
