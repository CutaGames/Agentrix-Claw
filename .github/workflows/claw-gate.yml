name: claw-gate
# CI-only code gates for CutaGames/Agentrix that need GitHub-hosted runners. Every gate/** branch is an orphan
# commit that holds only the paths the selected gates read plus this one workflow. Nothing is uploaded, released or
# deployed, no secret is used, and the token is read-only.
# Source: CutaGames/Agentrix @ b82cef64a2c522c4d4ba85ae58e09765aa656a20; gates: contract-hardhat,desktop-cargo,wallet-origin-build.
on:
  push:
    branches: ['gate/**']
permissions:
  contents: read
concurrency:
  group: claw-gate-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  NO_COLOR: '1'
  FORCE_COLOR: '0'
  npm_config_update_notifier: 'false'
  npm_config_fund: 'false'
  npm_config_audit: 'false'
  NEXT_TELEMETRY_DISABLED: '1'
  GATE_SOURCE_REPO: 'CutaGames/Agentrix'
  GATE_SOURCE_SHA: 'b82cef64a2c522c4d4ba85ae58e09765aa656a20'
  GATE_SELECTED: 'contract-hardhat,desktop-cargo,wallet-origin-build'
jobs:
  # Solidity on hardhat's built-in local network only: no private key, no RPC URL, no secret.
  contract-hardhat:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: deps
        id: deps
        working-directory: contract
        run: |
          npm ci
      - name: check
        id: check
        working-directory: contract
        run: |
          set +e; mkdir -p $GITHUB_WORKSPACE/out; S=$GITHUB_WORKSPACE/out/contract-hardhat.md; O=$GITHUB_WORKSPACE/out
          rc=0; npx hardhat compile > $O/hc.log 2>&1; c=$?
          echo "hardhat-compile rc=$c" >> $S
          [ $c = 0 ] || { echo '```'; tail -n 30 $O/hc.log; echo '```'; } >> $S
          [ $c = 0 ] || rc=1
          timeout 25m npx hardhat test --network hardhat > $O/ht.log 2>&1; t=$?
          { echo "hardhat-test rc=$t"; grep -E '^ +[0-9]+ (passing|failing|pending)' $O/ht.log | sed 's/^ */  /'; } >> $S
          [ $t = 0 ] || { echo '```'; grep -A12 -E '^ +[0-9]+\) ' $O/ht.log | head -80; tail -n 15 $O/ht.log; echo '```'; } >> $S
          [ $t = 0 ] || rc=1
          cat $S; exit $rc
      - name: step summary
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          S=$GITHUB_WORKSPACE/out/contract-hardhat.md
          {
            echo '## contract-hardhat'
            echo "source: $GATE_SOURCE_REPO@$GATE_SOURCE_SHA; mirror commit $GITHUB_SHA; run $GITHUB_RUN_ID"
            echo 'commands (cwd `contract/`): `npm ci`; `npx hardhat compile`; `timeout 25m npx hardhat test --network hardhat`'
            echo "steps: deps=$DEPS check=$CHECK"
            echo
            if [ -f "$S" ]; then cat "$S"; else echo 'no result file: the check step did not run (see deps above and the job log)'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHECK" = success ]; then lvl=notice; else lvl=error; fi
          msg=$( { echo "deps=$DEPS check=$CHECK"; [ -f "$S" ] && head -c 3500 "$S"; } | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::$lvl title=contract-hardhat result::$msg"
  # Desktop Rust library tests (Linux), then the standalone device-simulator and rental-trials crates when the
  # mirrored tree has them. No Node: the Tauri build only needs a ../dist directory, the check step writes a stub.
  desktop-cargo:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system packages (build-desktop.yml list, minus libappindicator3-dev, plus libxdo-dev)
        id: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - name: check
        id: check
        working-directory: desktop/src-tauri
        run: |
          set +e; mkdir -p $GITHUB_WORKSPACE/out; S=$GITHUB_WORKSPACE/out/desktop-cargo.md; O=$GITHUB_WORKSPACE/out
          mkdir -p ../dist; [ -f ../dist/index.html ] || echo '<!doctype html><title>stub</title>' > ../dist/index.html
          timeout 60m cargo test --lib > $O/c.log 2>&1; rc=$?
          { echo "desktop-cargo rc=$rc"; grep -E '^test result:' $O/c.log | sed 's/^/  /'; grep -E '^test .* FAILED$' $O/c.log | sort -u | head -40 | sed 's/^/  /'; } > $S
          [ $rc = 0 ] || { echo '```'; grep -E -A8 '^error' $O/c.log | head -80 | cut -c1-300; tail -n 30 $O/c.log | cut -c1-300; echo '```'; } >> $S
          D=$GITHUB_WORKSPACE/packages/device-simulator
          if [ -f $D/Cargo.toml ]; then (cd $D && timeout 30m cargo test > $O/sim.log 2>&1); s=$?; { echo "device-simulator rc=$s"; grep -E '^test result:' $O/sim.log | sed 's/^/  /'; grep -E '^test .* FAILED$' $O/sim.log | sort -u | head -40 | sed 's/^/  /'; } >> $S; [ $s = 0 ] || { echo '```'; grep -E -A8 '^error' $O/sim.log | head -60 | cut -c1-300; tail -n 20 $O/sim.log | cut -c1-300; echo '```'; } >> $S; [ -f $D/Cargo.lock ] && [ "$(git -C $GITHUB_WORKSPACE ls-files packages/device-simulator/Cargo.lock)" = '' ] && { echo 'device-simulator Cargo.lock (not committed yet; commit this exact file):'; echo '```toml'; cat $D/Cargo.lock; echo '```'; } >> $S; [ $s = 0 ] || rc=1; else echo 'device-simulator: not in this tree' >> $S; fi
          D2=$GITHUB_WORKSPACE/packages/rental-trials
          if [ -f $D2/Cargo.toml ]; then echo "/dev/kvm: $(ls -l /dev/kvm 2>/dev/null || echo 'no /dev/kvm')" >> $S; (cd $D2 && timeout 40m cargo test -- --nocapture > $O/trial.log 2>&1); t=$?; { echo "rental-trials rc=$t"; grep -E '^(TRIAL:|test result:)' $O/trial.log | sed 's/^/  /'; grep -E '^test .* FAILED$' $O/trial.log | sort -u | head -40 | sed 's/^/  /'; } >> $S; [ $t = 0 ] || { echo '```'; grep -E -A8 '^error' $O/trial.log | head -60 | cut -c1-300; tail -n 20 $O/trial.log | cut -c1-300; echo '```'; } >> $S; [ $t = 0 ] || rc=1; else echo 'rental-trials: not in this tree' >> $S; fi
          cat $S; exit $rc
      - name: step summary
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          S=$GITHUB_WORKSPACE/out/desktop-cargo.md
          {
            echo '## desktop-cargo'
            echo "source: $GATE_SOURCE_REPO@$GATE_SOURCE_SHA; mirror commit $GITHUB_SHA; run $GITHUB_RUN_ID"
            echo 'commands: apt-get install (build-desktop.yml list); cwd `desktop/src-tauri/`: `timeout 60m cargo test --lib`; cwd `packages/device-simulator/`: `timeout 30m cargo test`; cwd `packages/rental-trials/`: `timeout 40m cargo test -- --nocapture` (the last two only when the crate is in the tree)'
            echo "steps: deps=$DEPS check=$CHECK"
            echo
            if [ -f "$S" ]; then cat "$S"; else echo 'no result file: the check step did not run (see deps above and the job log)'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHECK" = success ]; then lvl=notice; else lvl=error; fi
          msg=$( { echo "deps=$DEPS check=$CHECK"; [ -f "$S" ] && head -c 3500 "$S"; } | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::$lvl title=desktop-cargo result::$msg"
  # The wallet origin static export (frontend/wallet-origin, Next output: 'export') and its post-build checks
  # (SRI, response headers, file manifest; fails on .well-known/, dynamic import( or a third-party source).
  # The NEXT_PUBLIC_* values below are gate-only build constants (public host names, not secrets); nothing from
  # this build is uploaded or deployed.
  wallet-origin-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_AGENT_WALLET_ORIGIN: 'https://wallet.agentrix.top'
      NEXT_PUBLIC_AGENT_WALLET_RP_ID: 'wallet.agentrix.top'
      NEXT_PUBLIC_AGENT_MAIN_ORIGIN: 'https://agentrix.top'
      NEXT_PUBLIC_AGENT_OWN_WALLET_API_ORIGIN: 'https://api.agentrix.top'
      NEXT_PUBLIC_AGENT_OWN_WALLET_CHAIN_ID: '97'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: deps
        id: deps
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
      - name: check
        id: check
        working-directory: frontend
        run: |
          set +e; mkdir -p $GITHUB_WORKSPACE/out; S=$GITHUB_WORKSPACE/out/wallet-origin-build.md; O=$GITHUB_WORKSPACE/out
          rc=0; timeout 30m node node_modules/next/dist/bin/next build wallet-origin > $O/wb.log 2>&1; b=$?
          echo "wallet-origin next build rc=$b" >> $S
          [ $b = 0 ] || { echo '```'; grep -E -A6 '(Type error|Failed to compile|Module not found|error TS|Error:)' $O/wb.log | head -80 | cut -c1-300; tail -n 40 $O/wb.log | cut -c1-300; echo '```'; rc=1; } >> $S
          if [ $b = 0 ]; then echo "  pages: $(cd wallet-origin/out && find . -name index.html | sort | tr '\n' ' ')" >> $S; node wallet-origin/scripts/postbuild.mjs > $O/pb.log 2>&1; p=$?; { echo "wallet-origin postbuild rc=$p"; head -n 60 $O/pb.log | cut -c1-300 | sed 's/^/  /'; } >> $S; [ $p = 0 ] || rc=1; else echo 'wallet-origin postbuild: not run (the build failed)' >> $S; fi
          cat $S; exit $rc
      - name: step summary
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          S=$GITHUB_WORKSPACE/out/wallet-origin-build.md
          {
            echo '## wallet-origin-build'
            echo "source: $GATE_SOURCE_REPO@$GATE_SOURCE_SHA; mirror commit $GITHUB_SHA; run $GITHUB_RUN_ID"
            echo 'commands (cwd `frontend/`): `npm ci --legacy-peer-deps --ignore-scripts`; `timeout 30m node node_modules/next/dist/bin/next build wallet-origin`; `node wallet-origin/scripts/postbuild.mjs`'
            echo "steps: deps=$DEPS check=$CHECK"
            echo
            if [ -f "$S" ]; then cat "$S"; else echo 'no result file: the check step did not run (see deps above and the job log)'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHECK" = success ]; then lvl=notice; else lvl=error; fi
          msg=$( { echo "deps=$DEPS check=$CHECK"; [ -f "$S" ] && head -c 3500 "$S"; } | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::$lvl title=wallet-origin-build result::$msg"
