appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 26: V4 Co-Raising + Greeting Card Full Flow
# Covers: M15-M17 (共养邀请 + 贺卡创建)
# ─────────────────────────────────────────────────────────────
---
- launchApp

- tapOn:
    id: "tab-plaza"

- waitForAnimationToEnd:
    timeout: 5000

- tapOn: "Play"

- waitForAnimationToEnd:
    timeout: 3000

# ── M15: 共养入口 ────────────────────────────────────────
- tapOn:
    text: "共养"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "26-coraising-entry"

# Should show invite UI
- assertVisible:
    text: "邀请"
    optional: true

- back

# ── M16: 贺卡收件箱 ──────────────────────────────────────
- tapOn:
    text: "贺卡"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "26-greeting-inbox"

- back

# ── M17: 贺卡创建 ────────────────────────────────────────
# Navigate to compose
- tapOn:
    text: "贺卡"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: "创建"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "26-greeting-compose"

# Template selection
- assertVisible:
    text: "模板"
    optional: true

- back

- back
