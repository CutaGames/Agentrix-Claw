appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 15: Global Inbox (bell) + Scan (camera) modal routing
# These are Root-level modal screens available from any Tab.
# ─────────────────────────────────────────────────────────────
---
- launchApp

# From Home, tap the bell icon
- tapOn:
    id: "tab-world"

- waitForAnimationToEnd:
    timeout: 5000

- tapOn: "🔔"

- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "15-inbox-from-home"

- assertVisible:
    text: "Inbox"
    optional: true

# Close modal (if it's modal-presented)
- tapOn:
    text: "✕"
    optional: true

# Scan from top bar
- tapOn: "📷"

- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "15-scan-from-home"

- back

# Same from Me tab
- tapOn:
    id: "tab-me"

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: "me-inbox-btn"
    optional: true

- takeScreenshot: "15-inbox-from-me"
