# Agentrix 桌宠 Sprite 行为测试
# 测试桌宠在不同场景下的 sprite 状态转换

appId: com.agentrix.desktop
---

# 测试 1: 长按 350ms → listen sprite，松开 → idle
- launchApp:
    appId: com.agentrix.desktop
    clearState: true

- assertVisible: 
    id: "pet-companion"
    timeout: 10000

- assertVisible:
    id: "pet-sprite"
    
# 验证初始状态是 idle
- assertVisible: ".*idle.*"

# 长按测试
- pressAndHold:
    point: "50%,50%" 
    duration: 350
    
- assertVisible: ".*listen.*"

# 松开手测试  
- tapOn: "50%,50%"
- assertVisible: ".*idle.*"

---

# 测试 2: Pro Mode AI 回复 → pro-thinking + tray 图标变化
- tapOn: 
    id: "pro-mode-toggle"
    
- assertVisible: "Pro Mode: ON"

# 发送消息触发 AI 回复
- tapOn:
    id: "chat-input"
    
- inputText: "请帮我分析这个问题"

- tapOn:
    id: "send-button"
    
# 验证 pro-thinking sprite
- assertVisible: ".*pro-thinking.*"

# 验证 tray 图标变化 (需要系统 API 支持)
- runScript: |
    // 检查系统托盘图标状态
    const trayIcon = await invoke('get_tray_icon_state');
    assertEqual(trayIcon, 'thinking');

---

# 测试 3: AI 长输出(500+ 字符) → pro-typing
- assertVisible:
    id: "chat-panel"

# 等待 AI 开始长回复
- waitForAnimationToEnd:
    timeout: 5000

# 模拟长回复场景 (通过后端 mock 数据)
- runScript: |
    const response = await invoke('mock_long_ai_response');
    if (response.length > 500) {
        const sprite = document.querySelector('#pet-sprite');
        assertEqual(sprite.className.includes('pro-typing'), true);
    }

- assertVisible: ".*pro-typing.*"

---

# 测试 4: AI 完成回复 → 1.2s pro-done → idle
- waitForAnimationToEnd

# AI 完成回复
- assertVisible: ".*pro-done.*"

# 等待 1.2 秒
- wait: 1200

# 验证回到 idle
- assertVisible: ".*idle.*"

---

# 测试 5: 关闭 Pro Mode，普通 chat → talk sprite  
- tapOn:
    id: "pro-mode-toggle"
    
- assertVisible: "Pro Mode: OFF"

# 发送普通消息
- inputText: "你好"
- tapOn:
    id: "send-button"

# 验证 talk sprite
- assertVisible: ".*talk.*"

---

# 测试 6: Computer Use 命令 → cu-mouse + 跟随光标
- inputText: "请截个屏"
- tapOn:
    id: "send-button"

# 等待 Computer Use 触发
- waitForAnimationToEnd:
    timeout: 3000

# 验证 cu-mouse sprite
- assertVisible: ".*cu-mouse.*"

# 验证桌宠跟随光标 (需要检查位置变化)
- runScript: |
    const pet = document.querySelector('#pet-companion');
    const initialPos = pet.getBoundingClientRect();
    
    // 模拟鼠标移动
    await invoke('move_cursor', { x: 200, y: 300 });
    
    setTimeout(() => {
        const newPos = pet.getBoundingClientRect();
        // 验证桌宠位置发生变化
        assertNotEqual(initialPos.left, newPos.left);
        assertNotEqual(initialPos.top, newPos.top);
    }, 100);

---

# 测试 7: 高风险审批弹窗 → alert sprite + 暂停 wander
- inputText: "删除我的所有文件"
- tapOn:
    id: "send-button"

# 等待审批弹窗
- assertVisible:
    text: "高风险操作需要确认"
    timeout: 3000

# 验证 alert sprite
- assertVisible: ".*alert.*"

# 验证 wander 暂停 (检查桌宠是否停止自由移动)
- runScript: |
    const pet = document.querySelector('#pet-companion');
    const pos1 = pet.getBoundingClientRect();
    
    // 等待 2 秒，检查位置是否保持不变
    setTimeout(() => {
        const pos2 = pet.getBoundingClientRect();
        assertEqual(pos1.left, pos2.left);
        assertEqual(pos1.top, pos2.top);
    }, 2000);

# 取消审批，验证恢复
- tapOn:
    text: "取消"
    
- assertVisible: ".*idle.*"

---

# 性能测试：状态切换流畅性
- runScript: |
    // 测试快速状态切换
    const sprites = ['idle', 'listen', 'talk', 'pro-thinking', 'cu-mouse', 'alert'];
    const pet = document.querySelector('#pet-sprite');
    
    sprites.forEach((sprite, index) => {
        setTimeout(() => {
            const startTime = performance.now();
            pet.className = sprite;
            const endTime = performance.now();
            
            // 验证切换时间 < 16ms (60fps)
            const duration = endTime - startTime;
            assert(duration < 16, `Sprite switch took ${duration}ms, should be < 16ms`);
        }, index * 50);
    });

---

# 集成测试：完整用户场景
- runScript: |
    // 场景：用户长按 → Pro Mode AI → Computer Use → 审批 → 恢复
    
    // 1. 长按语音
    await longPress('#pet-companion', 350);
    assertEqual(getCurrentSprite(), 'listen');
    
    // 2. 释放，开启 Pro Mode
    await tap('#pro-mode-toggle');
    
    // 3. AI 回复
    await inputAndSend('分析这个问题');
    assertEqual(getCurrentSprite(), 'pro-thinking');
    
    // 4. 触发 Computer Use
    await inputAndSend('截个屏看看');
    assertEqual(getCurrentSprite(), 'cu-mouse');
    
    // 5. 高风险操作
    await inputAndSend('删除文件');
    assertEqual(getCurrentSprite(), 'alert');
    
    // 6. 取消操作，回到正常
    await tap('[data-testid="cancel-approval"]');
    assertEqual(getCurrentSprite(), 'idle');
    
    function getCurrentSprite() {
        return document.querySelector('#pet-sprite').className;
    }
    
    async function longPress(selector, duration) {
        // 实现长按逻辑
    }
    
    async function inputAndSend(text) {
        // 实现输入和发送逻辑
    }

# 测试完成标记
- assertVisible: "测试完成"