## World Engine 副本探索测试
## Tests: 4.1-4.7 Dungeon Builder + 15.2 Dungeon UI
appId: app.agentrix.claw
name: World Engine — Dungeon Smoke
---
- launchApp
- tapOn: "萌宠"

# 副本入口需要从战斗或库存进入（V5 增加 Pet Hub 卡片入口前先验证扫描器入口可用）
- scrollUntilVisible:
    element:
      text: "世界扫描"
    direction: DOWN
- tapOn: "世界扫描"

# 切换到房间扫描模式
- tapOn: "房间扫描"
- assertVisible: "0° / 360°"

- tapOn: "取消"
