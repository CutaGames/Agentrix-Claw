appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 11: Plaza marketplace segments — Skills / Tasks / Pets / Resources
# (2026-09-27 M1: the old Feed / Play segments and the "Sports Predictions"
# segment are gone — D22. Segments use testID `marketplace-seg-<key>` from
# src/screens/market/MarketplaceScreen.tsx.)
# 强断言:deep-link 进 Plaza(避免 tab-tap 不可靠),逐段切换。
# ─────────────────────────────────────────────────────────────
---
- launchApp
- assertVisible:
    id: "tab-world"
- openLink: agentrix://plaza
- extendedWaitUntil:
    visible:
      id: "marketplace-seg-skills"
    timeout: 15000
- takeScreenshot: "11-plaza-skills"
- tapOn:
    id: "marketplace-seg-tasks"
- waitForAnimationToEnd
- takeScreenshot: "11-plaza-tasks"
- tapOn:
    id: "marketplace-seg-pets"
- waitForAnimationToEnd
- takeScreenshot: "11-plaza-pets"
- tapOn:
    id: "marketplace-seg-resources"
- waitForAnimationToEnd
- takeScreenshot: "11-plaza-resources"
- tapOn:
    id: "marketplace-seg-skills"
- waitForAnimationToEnd
- takeScreenshot: "11-plaza-skills-again"
# The retired betting segment must not come back (D22).
- assertNotVisible:
    id: "marketplace-seg-predictions"
