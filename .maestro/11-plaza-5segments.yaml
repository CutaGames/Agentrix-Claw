appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 11: Plaza 5-segment flow — Feed / Skills / Tasks / Pets / Play
# 强断言(CI 实证):deep-link 进 Plaza(避免 tab-tap 不可靠),分段用 testID
# (plaza-seg-*,已从 Pressable 改 TouchableOpacity 让 Fabric 映射)逐段切换。
# ─────────────────────────────────────────────────────────────
---
- launchApp
- assertVisible:
    id: "tab-world"
- openLink: agentrix://plaza
- extendedWaitUntil:
    visible:
      id: "plaza-seg-feed"
    timeout: 15000

# ── 逐段切换:每段 testID 必须存在且可点(验证 5-segment 栏完整)──
- tapOn:
    id: "plaza-seg-skills"
- waitForAnimationToEnd
- takeScreenshot: "11-plaza-skills"
- tapOn:
    id: "plaza-seg-tasks"
- waitForAnimationToEnd
- takeScreenshot: "11-plaza-tasks"
- tapOn:
    id: "plaza-seg-pets"
- waitForAnimationToEnd
- takeScreenshot: "11-plaza-pets"
- tapOn:
    id: "plaza-seg-play"
- waitForAnimationToEnd
- takeScreenshot: "11-plaza-play"
- tapOn:
    id: "plaza-seg-feed"
- waitForAnimationToEnd
- takeScreenshot: "11-plaza-feed"
