## World Engine 战斗流程测试
## Tests: 6.1-6.3 Battle Engine + 15.2 Battle UI
appId: com.agentrix.claw
name: World Engine — Battle Smoke
---
- launchApp
- tapOn: "萌宠"
- scrollUntilVisible:
    element:
      text: "世界资产"
    direction: DOWN

- tapOn: "世界资产"

# 仅在有资产时测试战斗（否则跳过）
- runFlow:
    when:
      notVisible: "还没有世界资产"
    commands:
      # 长按第一个资产卡片
      - longPressOn:
          index: 0
          point: 50%, 50%
      # 验证上下文菜单出现
      - assertVisible: "重命名"
      - assertVisible: "重新生成"
      - assertVisible: "删除"
      - tapOn: "取消"
