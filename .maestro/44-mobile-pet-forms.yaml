appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 44: Mobile Pet Forms (Sprint P-6, 2026-05-22)
#
# Verifies that the GlobalFloatingBall renders a pet sprite (not the
# legacy "AX" letter mark) and that the bus-driven form switching is
# observable via testIDs:
#
#   floating-ball-sprite          — idle / minimized state
#   floating-ball-sprite-capsule  — capsule mode (listening / speaking)
#
# We can't reliably assert which exact frame is showing in Maestro
# (sprite cycles every 125–250 ms), but we can assert the testID is
# present, indicating the sprite renderer mounted instead of falling
# back to text.
# ─────────────────────────────────────────────────────────────
---
- launchApp

- tapOn: "Home"
- waitForAnimationToEnd:
    timeout: 5000

# ── Step 1: Floating ball sprite is mounted on Home ──
- assertVisible:
    id: "floating-ball-sprite"
    optional: true

- takeScreenshot: "44-pet-forms-idle"

# ── Step 2: Trigger Agent chat — sprite should switch to capsule ──
# Tap any agent card or the Summon CTA to open AgentChat. Once chat
# opens, the floating ball is hidden on the chat screen, so we step
# back and check the home view again.
- assertVisible:
    text: "💬"
    optional: true

- tapOn:
    text: "💬"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "44-pet-forms-after-summon"

- back

# ── Step 3: Pet drawer interaction — drawer should not unmount sprite ──
- scroll

- assertVisible:
    id: "floating-ball-sprite"
    optional: true

- takeScreenshot: "44-pet-forms-after-drawer"
