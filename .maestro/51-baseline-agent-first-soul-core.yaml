appId: app.agentrix.claw
# Current Agent-first baseline: four tabs, non-empty Agent name, Companion,
# and the complete Soul Core L0 six-anchor read/return path.
#
# 2026-09-16 decision d-35 (M0.0.8 = "Shell", MTR-R09.8): the floating ball /
# global Companion layer stays in the Agent-first default IA as the current
# canonical Agent's Shell (bound to SoulCoreRef.agentAccountId), so this gate
# keeps asserting the ball is PRESENT on all four tabs — the assertions below
# are the pre-d-32 baseline, restored verbatim ("CI gate 51 unchanged").
# The kill-switch build (EXPO_PUBLIC_MOBILE_PET_L2_SURFACE=0) is covered by
# 52-agent-first-pet-l2-kill-switch.yaml, which is not in the CI gate.
tags:
  - agent-first
  - ci-gate
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "tab-agent"
    timeout: 25000

# Four bottom destinations must be independently laid out and reachable.
- assertVisible:
    id: "tab-agent"
- assertVisible:
    id: "tab-work"
- assertVisible:
    id: "tab-economy"
- assertVisible:
    id: "tab-my"
- assertVisible:
    id: "agent-home-screen"

# Seeded instance exercises the same fallback/normalization path as real data.
- assertVisible:
    id: "agent-selected-name"
- assertVisible:
    text: "QA Agent"

# Companion must be present in the real authenticated shell, including Maestro.
- extendedWaitUntil:
    visible:
      id: "floating-ball-sprite"
    timeout: 10000
- longPressOn:
    id: "voice-floating-ball-core"
- extendedWaitUntil:
    visible:
      id: "pet-detail-sheet"
    timeout: 8000
- back
- waitForAnimationToEnd

- tapOn:
    id: "tab-work"
- extendedWaitUntil:
    visible:
      id: "work-home-screen"
    timeout: 10000
- assertVisible:
    id: "floating-ball-sprite"

- tapOn:
    id: "tab-economy"
- extendedWaitUntil:
    visible:
      id: "economy-home-screen"
    timeout: 10000
- assertVisible:
    id: "floating-ball-sprite"

- tapOn:
    id: "tab-my"
- extendedWaitUntil:
    visible:
      id: "me-profile-screen"
    timeout: 10000
- assertVisible:
    id: "floating-ball-sprite"

# Soul Core L0: enter from Me, verify all six anchors, and return deterministically.
- scrollUntilVisible:
    element:
      id: "me-soul-core"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "me-soul-core"
- extendedWaitUntil:
    visible:
      id: "soul-core-l0-hero"
    timeout: 10000
- assertVisible:
    id: "soul-core-back"
- assertVisible:
    id: "soul-core-anchor-identity"
- scrollUntilVisible:
    element:
      id: "soul-core-anchor-vault"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "soul-core-anchor-authority"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "soul-core-anchor-reputation"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "soul-core-anchor-soulKey"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "soul-core-anchor-ownership"
    direction: DOWN
- takeScreenshot: "51-soul-core-l0-six-anchors"
- tapOn:
    id: "soul-core-back"
- extendedWaitUntil:
    visible:
      id: "me-profile-screen"
    timeout: 10000
- takeScreenshot: "51-baseline-returned-to-me"
