appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# 90 · V7 Agent-first 四 tab 冒烟（MTR-R06.3 / M1.6.1）
#
# 前提：EXPO_PUBLIC_MOBILE_AGENT_FIRST_IA=1 的 E2E 构建（flag-on 跑）。
# flag-off 构建请跑 10-4tab-smoke（legacy IA），两者构成 M1.6.3 的双跑。
#
# 覆盖：冷启动进 Agent tab → 浮球 Shell 在场（d-35：M0.0.8 = Shell）→
#       Work / Economy / My 各自可达 → V7 深链进对 IA → legacy 家族深链按
#       2026-09-16 决定 d-35 落位：World / Plaza（含 Aeon / Market / Social /
#       Team 改写进来的路径）= hidden route + L2 flag 默认 off →
#       destination-error(surface_flag_off)（文案即用户迁移说明）；Pet 家族不撤出
#       → `agentrix://me/pet/wardrobe` 直达衣柜；退役根路径 → destination-error
#       （MTR-R08.2：不白屏、不循环、不落错 Agent）。
# 不覆盖：push 入口（Maestro 构建默认跳过 push listener，见 M0.0.6 /
#       EXPO_PUBLIC_MAESTRO_KEEP_PUSH）；证据靠 pushDestination 单测 + M0.4.7 真机。
# 状态：2026-09-15 写出；2026-09-16 按 d-32 更新并进 CI 名单（REAL：Claw build #521
#       Passed）；同日按 d-35 改为 Shell 口径 + World/Plaza flag-off 落位（REAL：#524 / #525
#       Passed）；2026-09-18 加「名片与带回家」入口 + 名片只读屏可达（REAL 待第七轮）。
# ─────────────────────────────────────────────────────────────
tags:
  - agent-first
  - ci-gate
---
- launchApp:
    clearState: true

# 冷启动：默认 tab 必须是 Agent，四个 tab 同时在场。
- extendedWaitUntil:
    visible:
      id: "tab-agent"
    timeout: 25000
- assertVisible:
    id: "tab-work"
- assertVisible:
    id: "tab-economy"
- assertVisible:
    id: "tab-my"
- assertVisible:
    id: "agent-home-screen"
- assertVisible:
    id: "agent-selected-name"

# d-35 / MTR-R09.8：浮球是当前 canonical Agent 的 Shell，agent-first 默认 IA 下可见。
- extendedWaitUntil:
    visible:
      id: "floating-ball-sprite"
    timeout: 10000
- takeScreenshot: "90-v7-agent-home-with-shell"

# 名片与带回家（矩阵行 17 / 41；Agent Passport v4 三端集成 §2；M5.1.1 只挂入口）：
# 名片是唯一的原生只读屏（同一份投影、同一个 AGX 编号）；带回家 / 分身是 Web handoff。
# 入口在 Agent home 下半段，先滚到可见。E2E 种子会话对 live 读投影会 401 → 读态提示 +
# 全部「尚未确认」的章，但 AGX 编号来自账号 id 哈希，始终在场。
- scrollUntilVisible:
    element:
      id: "agent-open-passport"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "agent-bring-home-web"
- tapOn:
    id: "agent-open-passport"
- extendedWaitUntil:
    visible:
      id: "agent-passport-screen"
    timeout: 10000
- assertVisible:
    id: "agent-passport-number"
- takeScreenshot: "90-v7-agent-passport-read-only"
# 回 Agent home（再点已选中的 tab = popToTop；不用 back，见 51 的 gotcha）。
- tapOn:
    id: "tab-agent"
- extendedWaitUntil:
    visible:
      id: "agent-home-screen"
    timeout: 10000

# Work
- tapOn:
    id: "tab-work"
- extendedWaitUntil:
    visible:
      id: "work-home-screen"
    timeout: 10000
- takeScreenshot: "90-v7-work-home"

# Economy
- tapOn:
    id: "tab-economy"
- extendedWaitUntil:
    visible:
      id: "economy-home-screen"
    timeout: 10000
- takeScreenshot: "90-v7-economy-home"

# My
- tapOn:
    id: "tab-my"
- extendedWaitUntil:
    visible:
      id: "me-profile-screen"
    timeout: 10000
- takeScreenshot: "90-v7-my-home"

# V7 深链进对 IA（linking 由 src/app/linking.ts 在 flag 表配置之后构建）。
- openLink: agentrix://agents
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible:
      id: "agent-home-screen"
    timeout: 15000

# Plaza = hidden route + L2 flag `mobile.world_plaza_l2_surface` 默认 off（d-35 / M0.0.7）：
# 深链落 destination-error(surface_flag_off)，卡片文案即用户迁移说明。
# （d-32 过渡期这里曾断言 marketplace-screen 可见，#521 已 Passed；flag on 时仍可达。）
- openLink: agentrix://plaza
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible:
      id: "destination-error-screen"
    timeout: 15000
- assertVisible:
    text: "surface_flag_off"
- takeScreenshot: "90-v7-legacy-plaza-migration-card"

# Market 家族经 legacyRouteTable 改写进 Plaza，同样落迁移卡。
- openLink: agentrix://market/skill/qa-skill
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible:
      id: "destination-error-screen"
    timeout: 15000
- assertVisible:
    text: "surface_flag_off"

# Pet 家族不撤出（d-35）：`mobile.pet_l2_surface` 默认 on，深链直达 My 栈的衣柜。
- openLink: agentrix://me/pet/wardrobe
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible:
      id: "pet-wardrobe-screen"
    timeout: 15000
- assertNotVisible:
    id: "destination-error-screen"
- takeScreenshot: "90-v7-legacy-pet-wardrobe-reachable"

# 退役根路径（InvitationGate）落 destination-error(legacy_route_retired)。
- openLink: agentrix://invitation-gate
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible:
      id: "destination-error-screen"
    timeout: 15000
- assertVisible:
    text: "legacy_route_retired"

# 回到 Agent tab，确认没有被错误页卡住。
- tapOn:
    id: "tab-agent"
- extendedWaitUntil:
    visible:
      id: "agent-home-screen"
    timeout: 10000
- takeScreenshot: "90-v7-returned-to-agent"
