appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# 90 · V7 Agent-first 四 tab 冒烟（MTR-R06.3 / M1.6.1）
#
# 前提：EXPO_PUBLIC_MOBILE_AGENT_FIRST_IA=1 的 E2E 构建（flag-on 跑）。
# flag-off 构建请跑 10-4tab-smoke（legacy IA），两者构成 M1.6.3 的双跑。
#
# 覆盖：冷启动落 Agent tab → Work / Economy / My 各自可达 →
#       V7 深链进对 IA → legacy 家族深链按 2026-09-16 决定（d-32）落位：
#       World / Plaza = hidden route（仍可达）、Pet 家族 = L2 flag off →
#       destination-error(surface_flag_off)、退役根路径 → destination-error
#       （MTR-R08.2：不白屏、不循环、不落错 Agent）。
# 不覆盖：push 入口（Maestro 构建默认跳过 push listener，见 M0.0.6 /
#       EXPO_PUBLIC_MAESTRO_KEEP_PUSH）；证据走 pushDestination 单测 + M0.4.7 真机。
# 状态：2026-09-15 写出；2026-09-16 按 d-32 更新；进入 build-apk.yml 的 CI 名单（REAL 待跑）。
# ─────────────────────────────────────────────────────────────
tags:
  - agent-first
  - ci-gate
---
- launchApp:
    clearState: true

# 冷启动：默认 tab 必须是 Agent，四个 tab 同时在场。
- extendedWaitUntil:
    visible:
      id: "tab-agent"
    timeout: 25000
- assertVisible:
    id: "tab-work"
- assertVisible:
    id: "tab-economy"
- assertVisible:
    id: "tab-my"
- assertVisible:
    id: "agent-home-screen"
- assertVisible:
    id: "agent-selected-name"
- takeScreenshot: "90-v7-agent-home"

# Work
- tapOn:
    id: "tab-work"
- extendedWaitUntil:
    visible:
      id: "work-home-screen"
    timeout: 10000
- takeScreenshot: "90-v7-work-home"

# Economy
- tapOn:
    id: "tab-economy"
- extendedWaitUntil:
    visible:
      id: "economy-home-screen"
    timeout: 10000
- takeScreenshot: "90-v7-economy-home"

# My
- tapOn:
    id: "tab-my"
- extendedWaitUntil:
    visible:
      id: "me-profile-screen"
    timeout: 10000
- takeScreenshot: "90-v7-my-home"

# V7 深链进对 IA（linking 由 src/app/linking.ts 在 flag 表配置之后构建）。
- openLink: agentrix://agents
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible:
      id: "agent-home-screen"
    timeout: 15000

# Plaza 是 hidden route（d-32）：深链仍可达，落 Marketplace 而不是白屏。
- openLink: agentrix://plaza
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible:
      id: "plaza-seg-feed"
    timeout: 15000
- takeScreenshot: "90-v7-legacy-plaza-hidden-route"

# Pet 家族在 L2 flag off 时落 destination-error(surface_flag_off)。
- openLink: agentrix://me/pet/wardrobe
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible:
      id: "destination-error-screen"
    timeout: 15000
- assertVisible:
    text: "surface_flag_off"
- takeScreenshot: "90-v7-legacy-pet-destination-error"

# 退役根路径（InvitationGate）落 destination-error(legacy_route_retired)。
- openLink: agentrix://invitation-gate
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible:
      id: "destination-error-screen"
    timeout: 15000
- assertVisible:
    text: "legacy_route_retired"

# 回到 Agent tab，确认没有被错误页卡住。
- tapOn:
    id: "tab-agent"
- extendedWaitUntil:
    visible:
      id: "agent-home-screen"
    timeout: 10000
- takeScreenshot: "90-v7-returned-to-agent"
