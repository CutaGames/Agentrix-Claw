appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 20: V4 Home Tab Full Verification
# Covers: M2-M4 (Home Tab 主宠 + 签到 + 召唤 CTA)
# ─────────────────────────────────────────────────────────────
# LEGACY-ONLY (M1.6.2, 2026-09-16): drives the World / Summon / Plaza / Me tab shell, which the
# Agent-first IA no longer shows. Run against an EXPO_PUBLIC_MOBILE_AGENT_FIRST_IA=0 build only;
# not part of the Agent-first CI gate (build-apk.yml).
tags:
  - legacy-ia
---
- launchApp

- tapOn:
    id: "tab-world"

- waitForAnimationToEnd:
    timeout: 5000

# ── M2: 主宠显示 ────────────────────────────────────────
- takeScreenshot: "20-home-pet-visible"

# Pet renderer should be visible (XP bar or emotion indicator)
- assertVisible:
    text: "XP"
    optional: true

# ── M3: 签到 ────────────────────────────────────────────
- assertVisible:
    text: "签到"
    optional: true

- tapOn:
    text: "签到"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "20-home-checkin"

# ── M4: 召唤 CTA ────────────────────────────────────────
- assertVisible:
    text: "召唤"
    optional: true

- tapOn:
    text: "召唤"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "20-home-summon-cta"

- back
