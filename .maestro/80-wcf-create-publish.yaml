# Maestro E2E — World Creation & Feed: 一句话创作 → 生成 → 发布 (task 13.1)
#
# spec: .kiro/specs/world-creation-feed/{requirements,tasks}.md
#   - 需求 2.1/2.9:单一动作创作(描述→生成);2.2:三档连续谱;3.1/3.6:审核发布。
#   - 对照 ui-design §1/§5。
#
# 强断言策略(CI 实证):
#   - app 在 CI 为英文 + 用 e2e-token,故用 **testID**(非中文文案)、不断言后端结果。
#   - deep-link 直达创作器 → 与 hasCreations 无关,确定性可达。
#   - 创作器外壳 + 类型链 + 三档连续谱 + 生成/发布按钮的存在与可交互是确定性的,强断言;
#     生成/发布是服务端动作(e2e-token 下会失败),只触发不断言其结果。
appId: app.agentrix.claw
name: WCF — Create → Publish
---
- launchApp
- assertVisible:
    id: "tab-world"

# ── deep-link 直达统一创作器(状态无关)──────────────────────
- openLink: agentrix://world/new
- extendedWaitUntil:
    visible:
      id: "creation-creator-scroll"
    timeout: 25000

# ── 单一动作创作面:类型链 + 三档连续谱 + 生成 + 发布(均强断言存在)──
- assertVisible:
    id: "creator-type-shop"
- assertVisible:
    id: "creator-mode-promptDrive"
- assertVisible:
    id: "creator-generate-btn"
- assertVisible:
    id: "creator-publish-btn"

# ── 类型 + 连续谱可交互(需求 2.1/2.9/2.2)──────────────────
- tapOn:
    id: "creator-type-shop"
- tapOn:
    id: "creator-mode-coEdit"
- tapOn:
    id: "creator-mode-handBuild"
- tapOn:
    id: "creator-mode-promptDrive"

# ── 描述输入(testID,语言无关)──────────────────────────────
- tapOn:
    id: "creator-title-input"
- inputText: "Late-night pour-over cafe"
- tapOn:
    id: "creator-prompt-input"
- inputText: "A cozy late-night pour-over cafe, americano 18, seat reservation"
- hideKeyboard

# ── 触发生成(服务端动作;e2e 后端无授权,结果不断言)────────
- tapOn:
    id: "creator-generate-btn"
- waitForAnimationToEnd
- takeScreenshot: "80-creator-shell"
