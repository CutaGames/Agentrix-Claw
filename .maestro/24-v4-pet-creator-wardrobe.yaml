appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 24: V4 PetCreator + Wardrobe + Soul Picker
# Covers: M25-M28 (文生 + 衣柜 + 灵魂 + 繁殖)
# ─────────────────────────────────────────────────────────────
---
- launchApp

- tapOn: "Home"

- waitForAnimationToEnd:
    timeout: 5000

# ── M25: PetCreator 文生 ─────────────────────────────────
- scroll

- tapOn:
    text: "Create"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "24-pet-creator"

# Input prompt
- tapOn:
    id: "pet-creator-prompt"
    optional: true

- inputText: "一只可爱的蓝色小猫"

- takeScreenshot: "24-pet-creator-input"

- back

# ── M26: 衣柜 ────────────────────────────────────────────
- scroll

- tapOn:
    text: "Wardrobe"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "24-wardrobe"

# Skin grid should be visible
- assertVisible:
    text: "装备"
    optional: true

- back

# ── M27: 灵魂切换 ────────────────────────────────────────
- scroll

- tapOn:
    text: "Soul"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "24-soul-picker"

# 6 clan tabs
- assertVisible:
    text: "A"
    optional: true

- back

# ── M28: 繁殖 ────────────────────────────────────────────
- scroll

- tapOn:
    text: "Breed"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "24-breed"

# Should show parent selection
- assertVisible:
    text: "父系"
    optional: true

- back
