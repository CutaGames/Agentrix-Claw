## World Engine 库存冒烟测试
## Tests: 12.1 Inventory API + 15.1 Inventory UI
appId: app.agentrix.claw
name: World Engine — Inventory Smoke
---
- launchApp
- tapOn: "萌宠"

# 找到世界资产入口
- scrollUntilVisible:
    element:
      text: "世界资产"
    direction: DOWN

- tapOn: "世界资产"

# 验证库存屏加载
- assertVisible: "世界资产"

# 验证空状态或网格
- runFlow:
    when:
      visible: "还没有世界资产"
    commands:
      - assertVisible: "📷 开始扫描"
      - assertVisible: "扫描现实世界的物品"

# 测试筛选器（非空状态）
- runFlow:
    when:
      notVisible: "还没有世界资产"
    commands:
      - assertVisible: "最新"
      - assertVisible: "等级"
      - assertVisible: "战斗"
      - tapOn: "等级"
      - assertVisible: "全部"
