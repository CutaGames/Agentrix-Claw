## World Engine 扫描流程冒烟测试
## Tests: 14.1 scan UI + 14.2-14.5 quality gates + 18.1 face detection
appId: app.agentrix.claw
name: World Engine — Scan Flow Smoke
---
- launchApp
- assertVisible: "Home"

# 进入 Pet Tab
- tapOn: "萌宠"
- assertVisible: "萌宠"

# 滚动到底部找到 World Engine 入口
- scrollUntilVisible:
    element:
      text: "世界扫描"
    direction: DOWN
    timeout: 5000

# 点击 World Scanner 入口
- tapOn: "世界扫描"
- assertVisible:
    text: "快速扫描"
    timeout: 10000

# 检查三模式选择器
- assertVisible: "快速扫描"
- assertVisible: "精细扫描"
- assertVisible: "房间扫描"

# 切换到精细扫描
- tapOn: "精细扫描"

# 检查 8 位置环引导出现
- assertVisible:
    id: "frameCounter"
    timeout: 5000

# 测试取消按钮
- tapOn: "取消"
- assertVisible: "萌宠"
