appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 10: 世界 tab 可达冒烟(deep-link 确定性进 World Hub)。
# 精简为单一可靠落地断言 —— 重型 x86_64 CI 模拟器上连续多 deep-link 易渲染竞态 flake;
# 其余 tab 已由专用 flow 强测:Plaza→11/22、Summon→21、Me→28/64。
# ─────────────────────────────────────────────────────────────
# LEGACY-ONLY (M1.6.2, 2026-09-16): drives the World / Summon / Plaza / Me tab shell, which the
# Agent-first IA no longer shows. Run against an EXPO_PUBLIC_MOBILE_AGENT_FIRST_IA=0 build only;
# not part of the Agent-first CI gate (build-apk.yml).
tags:
  - legacy-ia
---
- launchApp
- assertVisible:
    id: "tab-world"
- openLink: agentrix://world
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible:
      id: "world-hub-scroll"
    timeout: 25000
- takeScreenshot: "10-world-hub"
