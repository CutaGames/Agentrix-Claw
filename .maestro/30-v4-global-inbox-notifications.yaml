appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 30: V4 Global Inbox + Notifications + Scan
# Covers: MH-1~2 (铃铛/扫码) + PN notifications
# Based on: UI_ELEMENT_AUDIT_MOBILE_2026-05.zh-CN.md §2.1 + §9
# ─────────────────────────────────────────────────────────────
# LEGACY-ONLY (M1.6.2, 2026-09-16): drives the World / Summon / Plaza / Me tab shell, which the
# Agent-first IA no longer shows. Run against an EXPO_PUBLIC_MOBILE_AGENT_FIRST_IA=0 build only;
# not part of the Agent-first CI gate (build-apk.yml).
tags:
  - legacy-ia
---
- launchApp

- tapOn:
    id: "tab-world"

- waitForAnimationToEnd:
    timeout: 5000

# ── MH-1: 全局 Inbox (铃铛) ─────────────────────────────
- tapOn:
    id: "global-inbox-btn"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "30-global-inbox"

# Verify inbox screen loaded
- assertVisible:
    text: "通知"
    optional: true

- back

# ── MH-2: 全局扫码 ──────────────────────────────────────
- tapOn:
    id: "global-scan-btn"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "30-global-scan"

# Camera permission may be requested — handle it
- tapOn:
    text: "允许"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "30-global-scan-camera"

- back

# ── MH-3: 宠物切换器 ────────────────────────────────────
- tapOn:
    id: "pet-switcher"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "30-pet-switcher"

# Close switcher
- tapOn:
    text: "取消"
    optional: true

- back
