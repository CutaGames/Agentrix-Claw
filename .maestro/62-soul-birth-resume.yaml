appId: app.agentrix.claw
name: Soul_Birth — Resume after process death (R1.4)
# ─────────────────────────────────────────────────────────────
# Test 62: soul-companion-onboarding — Soul_Birth 续跑 (resume).
#
# Spec: .kiro/specs/soul-companion-onboarding/{requirements,design}.md
#   design.md → Testing Strategy → "集成 / E2E (Maestro)":
#     "续跑:中途杀进程重进,从未完成步续跑。"
#   Requirement 1.4: 用户中途退出 App 后再次进入且 Soul_Birth 未完成,
#     编排器从最近一个未完成的 Onboarding_Step 续跑。
#
# Strategy:
#   1. Bootstrap to `birth` via the Me → 重看引导 replay entry (R1.7).
#   2. Complete `birth` (provision) → first_words appears.
#   3. Complete `first_words` (跳过这句) → orchestrator advances to first_task.
#   4. killApp + launchApp(clearState:false) — simulate process death without
#      wiping the MMKV `agentrix-soul-birth-v1` progress.
#   5. Assert the overlay RESUMES at `first_task` (R1.4), NOT restart at `birth`.
#
# The persisted `completed = {birth:true, first_words:true}` makes currentStep
# resolve to the first incomplete step = first_task after relaunch.
# ─────────────────────────────────────────────────────────────
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 8000

# ── Defensive: if a prior run left a Soul_Birth step overlay up, end it via
#    the global 跳过 (R1.5) so this flow starts from the normal main UI. ──
- runFlow:
    when:
      visible: "^跳过$"
    commands:
      - tapOn:
          text: "^跳过$"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000

# ── Bootstrap to a known `birth` state (R1.7) ──────────────────
- tapOn:
    text: "Me"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: "me-replay-onboarding"
    commands:
      - tapOn:
          id: "me-replay-onboarding"
      - tapOn:
          text: "重看|Replay"
          optional: true
      - waitForAnimationToEnd:
          timeout: 4000

# ── Complete birth (provision) → first_words ───────────────────
- runFlow:
    when:
      visible: "诞生你的 AI"
    commands:
      - tapOn:
          id: "birth-name-input"
      - inputText: "续跑测试"
      - hideKeyboard
      - tapOn:
          text: "赋予它灵魂"
      - takeScreenshot: "62-birth-awakening"
      # Wait out provision (R2.6, 90s hard timeout) until first_words bubble shows.
      - extendedWaitUntil:
          visible:
            id: "first-words-bubble"
          timeout: 95000

# ── Complete first_words (跳过这句) → advances to first_task ────
- runFlow:
    when:
      visible:
        id: "first-words-bubble"
    commands:
      - tapOn:
          text: "跳过这句.*"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000

# Confirm we reached first_task BEFORE killing the app.
- assertVisible:
    text: "让它帮你办成第一件事"
    optional: true
- takeScreenshot: "62-pre-kill-first-task"

# ── Simulate process death, then relaunch WITHOUT clearing state ──
# killApp = system-initiated process death; launchApp keeps app data so the
# persisted Soul_Birth progress survives (R1.4).
- killApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 8000

# ── RESUME assertion (R1.4): resumes at first_task, NOT at birth ──
# The key property: it must NOT restart the orchestration from `birth`.
- assertNotVisible: "诞生你的 AI"
- assertVisible:
    text: "让它帮你办成第一件事"
    optional: true
- takeScreenshot: "62-resumed-first-task"
