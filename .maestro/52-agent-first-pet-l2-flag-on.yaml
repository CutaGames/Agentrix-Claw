appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# 52 · Agent-first + Pet L2 flag ON (MTR-R09.8 rollback path / M1.6.3 flag-on run)
#
# Build prerequisite: EXPO_PUBLIC_MOBILE_AGENT_FIRST_IA=1 AND
# EXPO_PUBLIC_MOBILE_PET_L2_SURFACE=1. NOT part of the default CI gate
# (build-apk.yml builds with the L2 flag off); run it when validating the
# rollback of decision d-32 or a remote `mobile.pet_l2_surface=true` cohort.
#
# Covers: the Companion layer (floating ball → pet detail sheet) is back and
#         persists across the four tabs; My shows the Earnings Center again.
# Status: written 2026-09-16, not yet run (REAL pending a flag-on build).
# ─────────────────────────────────────────────────────────────
tags:
  - agent-first
  - pet-l2-on
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "tab-agent"
    timeout: 25000
- assertVisible:
    id: "agent-home-screen"

# Companion must be present in the authenticated shell when the L2 flag is on.
- extendedWaitUntil:
    visible:
      id: "floating-ball-sprite"
    timeout: 10000
- longPressOn:
    id: "voice-floating-ball-core"
- extendedWaitUntil:
    visible:
      id: "pet-detail-sheet"
    timeout: 8000
- back
- waitForAnimationToEnd

- tapOn:
    id: "tab-work"
- extendedWaitUntil:
    visible:
      id: "work-home-screen"
    timeout: 10000
- assertVisible:
    id: "floating-ball-sprite"

- tapOn:
    id: "tab-economy"
- extendedWaitUntil:
    visible:
      id: "economy-home-screen"
    timeout: 10000
- assertVisible:
    id: "floating-ball-sprite"

- tapOn:
    id: "tab-my"
- extendedWaitUntil:
    visible:
      id: "me-profile-screen"
    timeout: 10000
- assertVisible:
    id: "floating-ball-sprite"
- assertVisible:
    id: "me-axp-glance"
- scrollUntilVisible:
    element:
      id: "me-earnings-center"
    direction: DOWN
    timeout: 15000
- takeScreenshot: "52-pet-l2-on-my-with-earnings"
