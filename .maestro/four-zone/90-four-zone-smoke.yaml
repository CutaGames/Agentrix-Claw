appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Four-zone IA smoke (M1, D3): 伙伴 / 事项 / 分身 / 我的, reached the way the
# owner reaches them: tabs and rows, no deep links (those are in 91).
# Only for builds with EXPO_PUBLIC_MOBILE_FOUR_ZONE_IA=1. Kept out of the
# top-level folder on purpose: CI scans `.maestro/*.yaml` only, and the
# shipped (flag-off) build has no four-zone tabs. Run it explicitly:
#   maestro test .maestro/four-zone/90-four-zone-smoke.yaml
# Selectors are checked against src/ by
# src/navigation/__tests__/maestroSelectors.test.ts.
#
# CI build 528 failed at 外观 when it was opened with a deep link, with no
# screenshot or log from the run. 外观 is now opened from 我的 (the real
# path), and a failed step says where the app ended up instead (the
# `runFlow: when: notVisible` blocks).
# ─────────────────────────────────────────────────────────────
---
- launchApp
# ── Four tabs, default is 伙伴 ─────────────────────────────
- extendedWaitUntil:
    visible:
      id: "tab-companion"
    timeout: 20000
- assertVisible:
    id: "tab-matters"
- assertVisible:
    id: "tab-twin"
- assertVisible:
    id: "tab-my"
- takeScreenshot: "90-companion"
# The global pet layer is off in the four-zone IA (5.5).
- assertNotVisible:
    id: "floating-ball-sprite"
# ── 事项 ─────────────────────────────────────────────────
- tapOn:
    id: "tab-matters"
- extendedWaitUntil:
    visible:
      id: "matters-home-screen"
    timeout: 10000
# 待我处理 is one list (M3-a); an empty account shows the empty line.
- assertVisible:
    id: "matters-pending-list"
- takeScreenshot: "90-matters"
# 电脑上 → 急停回执 (REQ-mobile-074, L3). Read-only: never tap a quick action,
# an approval or "同步到手表" on this page. A failed read is said on the page
# (desktop-control-load-error), not in a dialog, so nothing blocks the run.
- tapOn:
    id: "matters-tab-on-computer"
- scrollUntilVisible:
    element:
      id: "device-safety-receipts"
    direction: DOWN
    timeout: 15000
- takeScreenshot: "90-matters-computer-safety-receipts"
- back
- extendedWaitUntil:
    visible:
      id: "matters-home-screen"
    timeout: 10000
# ── 分身: onboarding (no twin, 1.9) or the card (twin exists, M4-c) ──
- tapOn:
    id: "tab-twin"
- extendedWaitUntil:
    visible:
      id: "twin-home-screen"
    timeout: 10000
# Present in both states; the share button is never tapped in a smoke run.
- assertVisible:
    id: "twin-open-status"
- takeScreenshot: "90-twin"
# ── T5–T7 read-only pages under 分身 (L3). Opened the owner's way, from the
# 分身 rows. Only reads: no stop, unpublish, narrow, revoke, hide, deliver.
# 九步进度 (M5-a) is on the card only once a twin exists.
- runFlow:
    when:
      visible:
        id: "twin-creation-progress"
    commands:
      - takeScreenshot: "90-twin-creation-progress"
# 收入与回执 (M6-a): a list, "not open yet" or an empty list; never a crash.
- scrollUntilVisible:
    element:
      id: "twin-open-income"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "twin-open-income"
- extendedWaitUntil:
    visible:
      id: "twin-income-screen"
    timeout: 10000
- takeScreenshot: "90-twin-income"
- back
- extendedWaitUntil:
    visible:
      id: "twin-home-screen"
    timeout: 10000
# 公开状态 → 代表范围 (M4-e / M4-e2): the section exists only when the twin
# exists and its status reads, so it is looked for, not required.
- scrollUntilVisible:
    element:
      id: "twin-open-status"
    direction: UP
    timeout: 10000
- tapOn:
    id: "twin-open-status"
- extendedWaitUntil:
    visible:
      id: "twin-status-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "twin-mandate-section"
    direction: DOWN
    timeout: 8000
    optional: true
- takeScreenshot: "90-twin-mandate"
- back
- extendedWaitUntil:
    visible:
      id: "twin-home-screen"
    timeout: 10000
# Agent 护照 → 来访记录 (M4-f): opening the list is a read. Only when the
# account has a share link.
- scrollUntilVisible:
    element:
      id: "twin-open-passport"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "twin-open-passport"
- extendedWaitUntil:
    visible:
      id: "twin-passport-screen"
    timeout: 10000
# 护照只读卡 (L3): shown once the projection reads; an account without one
# sees the honest "unavailable" line instead.
- runFlow:
    when:
      visible:
        id: "twin-passport-card"
    commands:
      - takeScreenshot: "90-twin-passport-card"
- scrollUntilVisible:
    element:
      id: "twin-passport-visitors-toggle-.*"
    direction: DOWN
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: "twin-passport-visitors-toggle-.*"
    commands:
      - tapOn:
          id: "twin-passport-visitors-toggle-.*"
          index: 0
      - takeScreenshot: "90-twin-passport-visitors"
- takeScreenshot: "90-twin-passport"
- back
- extendedWaitUntil:
    visible:
      id: "twin-home-screen"
    timeout: 10000
# ── 我的: catalog-driven home ─────────────────────────────
- tapOn:
    id: "tab-my"
- extendedWaitUntil:
    visible:
      id: "my-home-screen"
    timeout: 10000
- assertVisible:
    id: "my-tab-import"
- assertVisible:
    id: "my-tab-devices"
- assertVisible:
    id: "my-tab-wallet"
- takeScreenshot: "90-my"
# 设备 (M1-k): computers + hardware, read-only.
- tapOn:
    id: "my-tab-devices"
- extendedWaitUntil:
    visible:
      id: "my-devices-screen"
    timeout: 10000
- takeScreenshot: "90-my-devices"
- back
- extendedWaitUntil:
    visible:
      id: "my-home-screen"
    timeout: 10000
# ── 外观 (M1-e / M1-n): 我的 → 外观; the row is below the fold on small screens ──
- scrollUntilVisible:
    element:
      id: "my-tab-appearance"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "my-tab-appearance"
- extendedWaitUntil:
    visible:
      id: "appearance-screen"
    timeout: 10000
    optional: true
# 外观 did not open: fail on the line that names where the app is instead.
- runFlow:
    when:
      notVisible:
        id: "appearance-screen"
    commands:
      # Still on 我的: the tap did nothing.
      - assertNotVisible:
          id: "my-home-screen"
      # Back on 伙伴: the app restarted, or the error boundary reset it after a render error.
      - assertNotVisible:
          id: "agent-chat-screen"
      # No tab bar: the app is not in front (crash, system dialog).
      - assertVisible:
          id: "tab-my"
- assertVisible:
    id: "appearance-screen"
# The default is 浅色 + 晴空蓝 since E83: try the other side, then put the default back.
- tapOn:
    id: "appearance-mode-dark"
- tapOn:
    id: "appearance-accent-obsidian-cyan"
- takeScreenshot: "90-appearance-dark-cyan"
- tapOn:
    id: "appearance-mode-light"
- tapOn:
    id: "appearance-accent-sky-blue"
- takeScreenshot: "90-appearance-light-sky"
- back
- extendedWaitUntil:
    visible:
      id: "my-home-screen"
    timeout: 10000
