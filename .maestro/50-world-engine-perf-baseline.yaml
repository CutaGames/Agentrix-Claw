## World Engine Performance Baseline
## Tests: 22.1 FPS / memory baseline on min-spec devices
##
## Required env (passed via Maestro --env):
##   FPS_THRESHOLD: minimum p99 FPS (default 30)
##   MEM_BUDGET_MB: max memory budget in MB (default 350)
##
## Run on:
##   - Profile A: 4GB RAM Android (min-spec full mode)
##   - Profile B: 2GB RAM Android (degraded mode)
##
appId: app.agentrix.claw
name: World Engine — Performance Baseline
---
- launchApp:
    arguments:
      perfMonitor: "true"

# ─────────────────────────────────────────────────────────────
# Phase 1: Pet Tab navigation perf
# ─────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-world"
- waitForAnimationToEnd:
    timeout: 5000

# Capture FPS sample at the entry point
- takeScreenshot: "perf-pet-tab"

# ─────────────────────────────────────────────────────────────
# Phase 2: Scanner cold-start perf (most expensive)
# ─────────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "世界扫描"
    direction: DOWN

- tapOn: "世界扫描"

# Camera mount + first frame should arrive within 2s
- extendedWaitUntil:
    visible:
      text: "快速扫描"
    timeout: 3000

- takeScreenshot: "perf-scanner-cold-start"

# Hold for 5s — measure sustained FPS during camera preview
- waitForAnimationToEnd:
    timeout: 5000

# Switch modes (Detail = AR overlay, more expensive)
- tapOn: "精细扫描"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "perf-scanner-detail-mode"

# ─────────────────────────────────────────────────────────────
# Phase 3: Inventory grid perf (12+ assets render)
# ─────────────────────────────────────────────────────────────
- tapOn: "取消"
- waitForAnimationToEnd:
    timeout: 2000

- scrollUntilVisible:
    element:
      text: "世界资产"
    direction: DOWN

- tapOn: "世界资产"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "perf-inventory-load"

# Scroll the grid to test virtualization
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    direction: UP
    duration: 500
- takeScreenshot: "perf-inventory-scroll"

# ─────────────────────────────────────────────────────────────
# Phase 4: Battle arena animation perf
# ─────────────────────────────────────────────────────────────
# Battle arena is the heaviest scene (animated HP + damage pops).
# Skipped if no assets exist.
- runFlow:
    when:
      notVisible: "还没有世界资产"
    commands:
      - longPressOn:
          index: 0
          point: 50%, 50%
      - takeScreenshot: "perf-context-menu"
      - tapOn: "取消"

# ─────────────────────────────────────────────────────────────
# Done
# ─────────────────────────────────────────────────────────────
- takeScreenshot: "perf-baseline-end"
