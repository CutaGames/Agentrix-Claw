appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 13: Me Tab → Subscribe (5-tier catalog) + AXP Center
# Ensures Sprint D screens render real data and toggles work.
# ─────────────────────────────────────────────────────────────
# LEGACY-ONLY (M1.6.2, 2026-09-16): drives the World / Summon / Plaza / Me tab shell, which the
# Agent-first IA no longer shows. Run against an EXPO_PUBLIC_MOBILE_AGENT_FIRST_IA=0 build only;
# not part of the Agent-first CI gate (build-apk.yml).
tags:
  - legacy-ia
---
- launchApp

- tapOn:
    id: "tab-me"

- waitForAnimationToEnd:
    timeout: 5000

# ── Tier badge present ───────────────────────────────────
- assertVisible:
    text: "FREE"
    optional: true

# ── Tap Upgrade ──────────────────────────────────────────
- tapOn:
    text: "Upgrade"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "13-subscribe-catalog"

# Cycle toggle
- tapOn:
    text: "Yearly"
    optional: true

- takeScreenshot: "13-subscribe-yearly"

- tapOn:
    text: "Monthly"
    optional: true

# Each of 5 tiers should be visible
- assertVisible:
    text: "Free"
    optional: true
- assertVisible:
    text: "Lite"
    optional: true
- assertVisible:
    text: "Plus"
    optional: true
- assertVisible:
    text: "Pro"
    optional: true
- assertVisible:
    text: "Elite"
    optional: true

- back

# ── AXP Center ───────────────────────────────────────────
- tapOn:
    text: "AXP"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "13-axp-center"

- assertVisible:
    text: "Balance"
    optional: true

- back
