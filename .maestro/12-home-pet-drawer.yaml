appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 12: Home Tab pet drawer (10 entries) navigation
# Verifies each drawer tile navigates to its target screen and
# back button returns to Home.
# ─────────────────────────────────────────────────────────────
---
- launchApp

- tapOn:
    id: "tab-world"

- waitForAnimationToEnd:
    timeout: 5000

# Summon CTA (main button on Home)
- assertVisible:
    text: "💬"
    optional: true

# ── Pet drawer 10 tiles ──────────────────────────────────
- scroll

- assertVisible:
    text: "Skills"
    optional: true

# Tap Skills tile (from drawer)
- tapOn:
    text: "Skills"

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "12-pet-skills"

- back

# Wallet tile
- scroll

- tapOn: "Wallet"

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "12-pet-wallet"

- back

# Wardrobe tile
- scroll

- tapOn: "Wardrobe"

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "12-pet-wardrobe"

- back

# Create tile
- scroll

- tapOn: "Create"

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "12-pet-create"

- back
