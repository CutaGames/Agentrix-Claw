appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 22: V4 Plaza Tab Full 5-Segment Verification (M8-M16)
# 强断言:deep-link 进 Plaza,plaza-seg-* testID 逐段切换 + 内容预览滚动。
# 各段内容卡文案随 i18n(CI 为英文),故内容断言用 optional;段切换用 testID 硬断。
# ─────────────────────────────────────────────────────────────
# LEGACY-ONLY (M1.6.2, 2026-09-16): drives the World / Summon / Plaza / Me tab shell, which the
# Agent-first IA no longer shows. Run against an EXPO_PUBLIC_MOBILE_AGENT_FIRST_IA=0 build only;
# not part of the Agent-first CI gate (build-apk.yml).
tags:
  - legacy-ia
---
- launchApp
- assertVisible:
    id: "tab-world"
- openLink: agentrix://plaza
- extendedWaitUntil:
    visible:
      id: "plaza-seg-feed"
    timeout: 15000

# ── M8: Feed ────────────────────────────────────────────
- tapOn:
    id: "plaza-seg-feed"
- waitForAnimationToEnd
- scroll
- takeScreenshot: "22-plaza-feed"

# ── M9: Skills ──────────────────────────────────────────
- tapOn:
    id: "plaza-seg-skills"
- waitForAnimationToEnd
- takeScreenshot: "22-plaza-skills"

# ── M10: Tasks ──────────────────────────────────────────
- tapOn:
    id: "plaza-seg-tasks"
- waitForAnimationToEnd
- takeScreenshot: "22-plaza-tasks"

# ── M11-M12: Pets (Skin Auction + Pet Auction) ──────────
- tapOn:
    id: "plaza-seg-pets"
- waitForAnimationToEnd
- takeScreenshot: "22-plaza-pets"

# ── M13-M16: Play ────────────────────────────────────────
- tapOn:
    id: "plaza-seg-play"
- waitForAnimationToEnd
- takeScreenshot: "22-plaza-play"
