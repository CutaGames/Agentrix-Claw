## AI World Creation Platform (v6) — Plot Marketplace deep (R11)
## Deepens 72 by exercising the tier filter chips. Reached via the new
## `agentrix://world/market` deep link (robust against the World-hub cohort
## gate). Listing rows (`plot-listing-*`) and the purchase modal
## (`plot-purchase-confirm`) are data-dependent (empty E2E catalog) so they are
## not asserted; the filter UI + scroll surface are deterministic.
appId: app.agentrix.claw
name: World Creation — Marketplace deep
---
- launchApp
- assertVisible:
    id: "tab-world"

# Deep-link straight into the Plot Marketplace.
- openLink: agentrix://world/market

# Marketplace mounts: tier filter chips + listings scroll surface.
- extendedWaitUntil:
    visible:
      id: "market-filter-tier-all"
    timeout: 12000
- assertVisible:
    id: "market-filter-tier-A"
- assertVisible:
    id: "market-filter-tier-B"
- assertVisible:
    id: "market-filter-tier-C"

# Cycle every tier filter — each chip is interactive (discovery by tier, R11).
# (The listings FlatList `plot-marketplace-scroll` only mounts with catalog
# data; the E2E backend is empty, so we assert the always-present filter bar.)
- tapOn:
    id: "market-filter-tier-A"
- tapOn:
    id: "market-filter-tier-B"
- tapOn:
    id: "market-filter-tier-C"
- tapOn:
    id: "market-filter-tier-all"

- takeScreenshot: "76-marketplace-deep"
