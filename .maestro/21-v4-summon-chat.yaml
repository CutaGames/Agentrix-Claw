appId: app.agentrix.claw
# ─────────────────────────────────────────────────────────────
# Test 21: V4 Summon Tab Chat + Voice + LLM Budget (M5-M7)
# 强断言(CI 实证):deep-link 进 Summon(避免 tab-tap 不可靠);聊天/语音/预算条
# 用 runFlow 守卫(仅在元素出现时交互),且**不触发真实 LLM 发送**(e2e-token 无授权
# 会挂起 → 旧版 12min 超时根因)。只验证 Summon 屏可达 + 输入区可输入。
# ─────────────────────────────────────────────────────────────
---
- launchApp
- assertVisible:
    id: "tab-world"

# ── deep-link 进 Summon ──────────────────────────────────
- openLink: agentrix://summon
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "21-summon-tab"

# ── M5: 输入区(仅在出现时输入,不发送,避免后端挂起)──────
- runFlow:
    when:
      visible:
        id: "chat-input"
    commands:
      - tapOn:
          id: "chat-input"
      - inputText: "E2E smoke"
      - hideKeyboard
      - takeScreenshot: "21-summon-input"

# ── M6: 语音按钮存在性(optional)────────────────────────
- assertVisible:
    id: "voice-btn"
    optional: true

# ── M7: LLM 预算条存在性(optional)──────────────────────
- assertVisible:
    id: "llm-budget-bar"
    optional: true
- takeScreenshot: "21-summon-budget"
