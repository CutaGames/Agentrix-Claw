[package]
name = "clawcore-esp32"
version = "0.1.0"
edition = "2021"
authors = ["Agentrix Hardware Team <hardware@agentrix.top>"]
description = "ClawCore Protocol v0 reference firmware for ESP32-S3 (Phase 5 W9 skeleton)"
license = "Apache-2.0"
repository = "https://github.com/CutaGames/Agentrix"

# ⚠️ This is a Phase 5 W9 skeleton — does NOT compile out-of-tree until Embassy
#    target wiring + esp-hal version pinning is finalised by @hardware.
#    Cargo metadata is committed for layout / RFC traceability.

[features]
default = ["transport-ws", "policy-l3-passthru"]
transport-ws = []
transport-ble = []
transport-mqtt = []
policy-l3-passthru = []
policy-l3-capture = []   # Reserved for Phase 5+ when on-device cosign lands

[dependencies]
# Held at exact versions to mirror @hardware's Phase 5 reference target.
# Bumping requires re-running the 100-item cert suite (QA-12.2).
embassy-executor = { version = "0.6", features = ["arch-xtensa", "executor-thread"] }
embassy-time     = "0.3"
embassy-futures  = "0.1"
heapless         = "0.8"
serde            = { version = "1", default-features = false, features = ["derive"] }
serde-json-core  = "0.5"
hmac             = { version = "0.12", default-features = false }
sha2             = { version = "0.10", default-features = false }
crc              = "3"
log              = "0.4"

# Hardware abstraction is left as a thin trait in `src/hal.rs` so the same
# protocol crate can re-target nRF52 (`clawcore-nrf-ref`) without changes.
# Concrete esp-hal binding ships in Phase 5 W10.

[dev-dependencies]
# Loopback test harness; runs on host so we exercise the wire format without a board.

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
