<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentrix</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">▲</span>
        <span class="brand-name">Agentrix</span>
      </div>
      <div class="actions">
        <button id="btn-summarize" title="Summarize current page">📄</button>
        <button id="btn-open-web" title="Open agentrix.top">↗</button>
      </div>
    </header>
    <main id="messages" class="messages">
      <div class="empty">
        <h2>Hi 👋</h2>
        <p>Ask anything, summarize this page, or pick a tool below.</p>
        <div class="quick-tools">
          <button data-prompt="Summarize this page in 5 bullets and 1 takeaway.">📝 Summarize page</button>
          <button data-prompt="Translate the selected text to English.">🌐 Translate selection</button>
          <button data-prompt="Make 5 LinkedIn post variants based on this page.">💬 LinkedIn posts</button>
          <button data-prompt="Generate a 5-slide deck based on this page.">🎯 Slides from page</button>
        </div>
      </div>
    </main>
    <footer class="composer">
      <textarea id="input" placeholder="Ask Agentrix… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send" title="Send (Enter)">↑</button>
    </footer>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
