[[permission]]
identifier = "developer-runtime"
description = """
Presentation / bootstrap / query / revoke / workspace-trust surface of the
Developer Runtime Host for the trusted app windows. High-risk claim/decide stay
inside the Rust host loop and are not WebView-invokable.
"""
commands.allow = [
  "developer_runtime_presentation",
  "developer_runtime_bootstrap",
  "developer_runtime_refresh",
  "developer_runtime_events",
  "developer_runtime_query",
  "developer_runtime_cancel",
  "developer_runtime_revoke",
  "developer_runtime_probe_vendor",
  "developer_runtime_trust_selected_workspace",
  # E32: bind this computer, read the binding status, sign an approval after the
  # native confirmation dialog, revoke the runtime credential on sign-out.
  "developer_runtime_enroll",
  "developer_runtime_enrollment_status",
  "developer_runtime_sign_approval",
  # REQ-desktop-010: device signature on the emergency-stop receipt.
  "developer_runtime_sign_safety_event",
  "developer_runtime_unenroll",
  # D5 slice 2 (order contract v0.11): read one order and write the delivery
  # draft with the runtime credential; read the local "drafted here" marks;
  # re-issue an expired runtime credential on a live binding with the owner's
  # sign-in (step 4 only). Delivering stays on the owner's sign-in in the order desk.
  "developer_runtime_order_get",
  "developer_runtime_order_put_draft",
  "developer_runtime_order_draft_marks",
  "developer_runtime_order_renew_credential",
]
