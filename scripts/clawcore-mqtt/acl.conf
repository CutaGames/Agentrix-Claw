# ACL rules for ClawCore EMQX broker (Phase 5 BE-10.1)
# Format: EMQX 5 ACL file syntax — {permit|deny, who, action, topics}.
#
# Rule order matters: first match wins. The default policy
# `authorization.no_match = deny` in emqx.conf means anything not whitelisted
# below is rejected.

# Admin client (used by ops + backend bridge consumer)
{allow, {username, "agentrix-admin"}, all, ["#"]}.

# Device clients can only act on their own /devices/<clientid>/* subtree.
# clientid == deviceId (enforced by backend authn hook).
{allow, all, publish,   ["agentrix/devices/${clientid}/up"]}.
{allow, all, publish,   ["agentrix/devices/${clientid}/presence"]}.
{allow, all, subscribe, ["agentrix/devices/${clientid}/down"]}.
{allow, all, subscribe, ["agentrix/devices/${clientid}/ota"]}.

# Catch-all deny (redundant given no_match=deny, but explicit for safety)
{deny, all, all, ["#"]}.
