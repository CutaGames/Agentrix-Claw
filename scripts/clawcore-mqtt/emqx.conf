# EMQX 5.x configuration for Agentrix ClawCore brokers (Phase 5 BE-10.1)
# Format: HOCON. Apply with scripts/clawcore-mqtt/apply.sh.

node {
  name = "emqx@127.0.0.1"
  cookie = "${EMQX_NODE_COOKIE}"
  data_dir = "/var/lib/emqx"
}

cluster {
  name = "agentrix-clawcore"
  discovery_strategy = "manual"
}

# -------- Listeners --------
# Public TLS listener for devices (ESP32 / nRF52 / phone bridges).
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 100000
  ssl_options {
    keyfile  = "/etc/letsencrypt/live/api.agentrix.top/privkey.pem"
    certfile = "/etc/letsencrypt/live/api.agentrix.top/fullchain.pem"
    versions = ["tlsv1.3", "tlsv1.2"]
    verify   = "verify_none"
  }
}

# WSS for browser-side debugging (Tauri + dev tools)
listeners.wss.default {
  bind = "0.0.0.0:8084"
  max_connections = 10000
  ssl_options {
    keyfile  = "/etc/letsencrypt/live/api.agentrix.top/privkey.pem"
    certfile = "/etc/letsencrypt/live/api.agentrix.top/fullchain.pem"
  }
}

# -------- Authentication: HTTP hook → backend --------
authentication = [
  {
    mechanism = "password_based"
    backend = "http"
    method = "post"
    url = "https://api.agentrix.top/api/v1/devices/mqtt/authn"
    body {
      client_id = "${clientid}"
      username  = "${username}"
      password  = "${password}"
    }
    headers { content-type = "application/json" }
    request_timeout = "5s"
    enable = true
  }
]

# -------- Authorization: file-based ACL + per-device template --------
authorization {
  no_match = "deny"
  deny_action = "ignore"
  cache { enable = true, max_size = 32, ttl = "1m" }
  sources = [
    {
      type = "file"
      enable = true
      path = "etc/acl.conf"
    }
  ]
}

# -------- MQTT runtime tuning --------
mqtt {
  max_packet_size = "256KB"          # OTA chunks ≤ 4KiB; padded for safety
  max_qos_allowed = 1                 # exactly-once not used
  retain_available = true
  keepalive_multiplier = 1.5
  shared_subscription = true
  max_inflight = 50                   # per-device
  max_mqueue_len = 200
}

# -------- Telemetry exposed to backend --------
log {
  console_handler {
    enable = true
    level = "info"
  }
  file_handlers.default {
    enable = true
    level = "info"
    file = "/var/log/emqx/emqx.log"
    max_size = "50MB"
    rotation_count = 10
  }
}

# -------- Bridge from broker → backend MQTT consumer --------
# The backend subscribes to 'agentrix/devices/+/up' via a separate persistent
# MQTT client (see backend/src/modules/device-registry/mqtt-bridge.* — TBD W11).
# No Kafka bridge in v1; revisit if device count > 50k.
