<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>霓虹贪吃蛇 · Neon Snake</title>
<style>
  html,body{margin:0;height:100%;background:#06120e;overflow:hidden;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;border-radius:10px}
  #hud{position:fixed;top:10px;left:0;right:0;text-align:center;color:#b8ffe0;font-size:15px;font-weight:800;text-shadow:0 1px 4px #000;pointer-events:none}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,18,14,.86);color:#fff;text-align:center;padding:24px}
  #overlay h1{font-size:30px;margin:0 0 6px;background:linear-gradient(90deg,#7be0a0,#22d3ee,#ffd166);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #overlay p{color:#9fd6c2;font-size:14px;margin:4px 0}
  #btn{margin-top:18px;padding:14px 32px;border:none;border-radius:14px;background:linear-gradient(135deg,#7be0a0,#22d3ee);color:#04120c;font-size:18px;font-weight:900}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud"><span id="score">0</span> 分 · 第 <span id="lvl">1</span> 关</div>
<div id="overlay"><h1>霓虹贪吃蛇</h1><p>滑动或方向键转向 · 吃光点变长 · 别撞墙和自己</p><button id="btn">开始</button></div>
<script>
(function(){
"use strict";
var CFG=(typeof window!=="undefined"&&window.__GAME_CONFIG)||{};
var DIFF=({easy:0.75,normal:1,hard:1.4}[CFG.difficulty])||1;
if(CFG.title){try{document.title=CFG.title;var hT=document.querySelector("#overlay h1");if(hT)hT.textContent=CFG.title;}catch(e){}}
var DPR=Math.min(window.devicePixelRatio||1,2),cv=document.getElementById("c"),ctx=cv.getContext("2d");
var GRID=17,cell=20,B=0;
function resize(){var m=Math.min(window.innerWidth,window.innerHeight*0.8,520)-16;cell=Math.floor(m/GRID);B=cell*GRID;cv.width=B*DPR;cv.height=B*DPR;cv.style.width=B+"px";cv.style.height=B+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener("resize",resize);resize();
var el={score:document.getElementById("score"),lvl:document.getElementById("lvl")};
var overlay=document.getElementById("overlay"),btn=document.getElementById("btn");
var S,snake,dir,nextDir,food,acc,running;
function newGame(){S={score:0,level:1,eaten:0};snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};nextDir=dir;placeFood();acc=0;running=true;tick=baseTick();upd();}
function baseTick(){return Math.max(70,(165-S.level*12)/DIFF);}
var tick=140,last=0;
function placeFood(){var ok=false;while(!ok){food={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID),gold:Math.random()<0.18};ok=!snake.some(function(s){return s.x===food.x&&s.y===food.y;});}}
function upd(){el.score.textContent=S.score;el.lvl.textContent=S.level;}
function setDir(x,y){if(snake.length>1&&x===-dir.x&&y===-dir.y)return;nextDir={x:x,y:y};}
window.addEventListener("keydown",function(e){if(e.key==="ArrowLeft")setDir(-1,0);else if(e.key==="ArrowRight")setDir(1,0);else if(e.key==="ArrowUp")setDir(0,-1);else if(e.key==="ArrowDown")setDir(0,1);});
var ts=null;
cv.addEventListener("touchstart",function(e){ts={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault&&e.preventDefault();},{passive:false});
cv.addEventListener("touchmove",function(e){if(!ts)return;var dx=e.touches[0].clientX-ts.x,dy=e.touches[0].clientY-ts.y;if(Math.abs(dx)+Math.abs(dy)<24)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);ts=null;e.preventDefault&&e.preventDefault();},{passive:false});
function over(){running=false;try{window.render_game_to_text=function(){return JSON.stringify({score:S.score,level:S.level,over:true});};if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify({type:'gameover',score:Math.max(0,Math.floor(S.score))}));}catch(e){}overlay.classList.remove("hide");overlay.innerHTML='<h1>撞到了!</h1><p>'+S.score+' 分 · 第 '+S.level+' 关</p><button id="btn">再来</button>';document.getElementById("btn").onclick=function(){overlay.classList.add("hide");newGame();};}
function move(){
  dir=nextDir;var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID||snake.some(function(s){return s.x===head.x&&s.y===head.y;})){over();return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){S.score+=food.gold?50:10;S.eaten++;if(S.eaten%5===0){S.level++;tick=baseTick();}placeFood();upd();}
  else snake.pop();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,B,B);g.addColorStop(0,"#0a2018");g.addColorStop(1,"#06120e");ctx.fillStyle=g;ctx.fillRect(0,0,B,B);
  ctx.strokeStyle="rgba(255,255,255,.04)";for(var i=1;i<GRID;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,B);ctx.moveTo(0,i*cell);ctx.lineTo(B,i*cell);ctx.stroke();}
  // food
  ctx.fillStyle=food.gold?"#ffd166":"#ff5d8f";ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*0.36,0,6.28);ctx.fill();ctx.shadowBlur=0;
  // snake
  for(var s=snake.length-1;s>=0;s--){var seg=snake[s];var t=1-s/snake.length;ctx.fillStyle=s===0?"#22d3ee":"rgba(123,224,160,"+(0.5+t*0.5)+")";if(s===0){ctx.shadowColor="#22d3ee";ctx.shadowBlur=12;}ctx.fillRect(seg.x*cell+2,seg.y*cell+2,cell-4,cell-4);ctx.shadowBlur=0;}
}
function loop(ts2){if(running){if(!last)last=ts2;acc+=ts2-last;last=ts2;if(acc>=tick){acc=0;move();}}else last=ts2;draw();requestAnimationFrame(loop);}
btn.onclick=function(){overlay.classList.add("hide");newGame();};newGame();running=false;requestAnimationFrame(loop);
})();
</script>
</body>
</html>
