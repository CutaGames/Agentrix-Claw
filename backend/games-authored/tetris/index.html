<!DOCTYPE html>
<!-- Agentrix 俄罗斯方块 Tetris — 手机优先 / 高 DPI / 完整触屏操控(左右/软降/旋转/硬降)/ 渐变方块。自研,无依赖。 -->
<html lang="zh"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>俄罗斯方块 Tetris</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d15;color:#e8ecf3;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #top{display:flex;justify-content:center;align-items:center;gap:18px;padding:10px;}
  .box{background:#141925;border:1px solid #232a3a;border-radius:10px;padding:6px 14px;text-align:center;min-width:64px;}
  .box .k{font-size:11px;color:#8b93a7;}.box .v{font-size:20px;font-weight:800;}
  #mid{display:flex;justify-content:center;gap:12px;align-items:flex-start;}
  canvas{background:#070a11;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:block;}
  #side{display:flex;flex-direction:column;gap:6px;}
  #nextLabel{font-size:11px;color:#8b93a7;text-align:center;}
  #pad{display:flex;justify-content:center;gap:12px;margin-top:14px;}
  .btn{width:64px;height:58px;border-radius:14px;background:#1b2230;border:1px solid #2c3444;
    color:#cfe0ff;font-size:24px;display:flex;align-items:center;justify-content:center;}
  .btn:active{background:#26304a;}
  #msg{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,10,16,.85);gap:14px;z-index:9;}
  #msg h1{margin:0;font-size:30px;}button{appearance:none;border:none;background:#5b8cff;color:#fff;
    font-weight:700;font-size:16px;padding:12px 28px;border-radius:12px;}
</style></head>
<body>
<div id="top">
  <div class="box"><div class="k">分数</div><div class="v" id="score">0</div></div>
  <div class="box"><div class="k">消行</div><div class="v" id="lines">0</div></div>
  <div class="box"><div class="k">等级</div><div class="v" id="level">1</div></div>
</div>
<div id="mid">
  <canvas id="b"></canvas>
  <div id="side"><div id="nextLabel">下一个</div><canvas id="n"></canvas></div>
</div>
<div id="pad">
  <div class="btn" id="left">◀</div>
  <div class="btn" id="rot">🔄</div>
  <div class="btn" id="right">▶</div>
  <div class="btn" id="soft">▼</div>
  <div class="btn" id="hard">⤓</div>
</div>
<div id="msg"><h1>💥 游戏结束</h1><p id="mp"></p><button id="again">再来一局</button></div>
<script>
(function(){
  var COLS=10,ROWS=20,cell=24,dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  var b=document.getElementById('b'),bx=b.getContext('2d');
  var n=document.getElementById('n'),nx=n.getContext('2d');
  var COLORS=['#000','#4cc9f0','#ffd166','#b15bff','#06d6a0','#ef476f','#5b8cff','#f9844a'];
  var SHAPES={
    I:[[1,1,1,1]],O:[[2,2],[2,2]],T:[[0,3,0],[3,3,3]],S:[[0,4,4],[4,4,0]],
    Z:[[5,5,0],[0,5,5]],J:[[6,0,0],[6,6,6]],L:[[0,0,7],[7,7,7]]};
  var KEYS=Object.keys(SHAPES);
  var grid,cur,nextK,px,py,score,lines,level,over,dropMs,acc,last;

  function layout(){
    var maxH=window.innerHeight-230, maxW=window.innerWidth-120;
    cell=Math.max(14,Math.floor(Math.min(maxH/ROWS, maxW/COLS)));
    b.style.width=cell*COLS+'px';b.style.height=cell*ROWS+'px';
    b.width=cell*COLS*dpr;b.height=cell*ROWS*dpr;bx.setTransform(dpr,0,0,dpr,0,0);
    var nc=Math.floor(cell*0.7); n.style.width=nc*4+'px';n.style.height=nc*4+'px';
    n.width=nc*4*dpr;n.height=nc*4*dpr;nx.setTransform(dpr,0,0,dpr,0,0); n._c=nc;
    draw();
  }
  function reset(){
    grid=[];for(var y=0;y<ROWS;y++){grid[y]=[];for(var x=0;x<COLS;x++)grid[y][x]=0;}
    score=0;lines=0;level=1;over=false;dropMs=800;acc=0;last=0;
    nextK=KEYS[Math.random()*KEYS.length|0];spawn();
    document.getElementById('msg').style.display='none';upd();layout();
  }
  function upd(){document.getElementById('score').textContent=score;
    document.getElementById('lines').textContent=lines;document.getElementById('level').textContent=level;}
  function spawn(){
    cur=SHAPES[nextK].map(function(r){return r.slice();});
    nextK=KEYS[Math.random()*KEYS.length|0];
    px=(COLS>>1)-(cur[0].length>>1);py=0;
    if(collide(cur,px,py)){over=true;document.getElementById('mp').textContent='得分 '+score;document.getElementById('msg').style.display='flex';}
    drawNext();
  }
  function collide(sh,ox,oy){
    for(var y=0;y<sh.length;y++)for(var x=0;x<sh[y].length;x++){if(!sh[y][x])continue;
      var nxp=ox+x,nyp=oy+y;if(nxp<0||nxp>=COLS||nyp>=ROWS)return true;if(nyp>=0&&grid[nyp][nxp])return true;}
    return false;
  }
  function merge(){for(var y=0;y<cur.length;y++)for(var x=0;x<cur[y].length;x++){if(cur[y][x]&&py+y>=0)grid[py+y][px+x]=cur[y][x];}}
  function rotate(){
    var s=cur,R=s.length,C=s[0].length,r=[];
    for(var x=0;x<C;x++){r[x]=[];for(var y=R-1;y>=0;y--)r[x].push(s[y][x]);}
    // wall kick: 尝试原位/左/右
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k<kicks.length;k++){if(!collide(r,px+kicks[k],py)){cur=r;px+=kicks[k];return;}}
  }
  function clearLines(){
    var cleared=0;
    for(var y=ROWS-1;y>=0;y--){if(grid[y].every(function(v){return v;})){grid.splice(y,1);grid.unshift(new Array(COLS).fill(0));cleared++;y++;}}
    if(cleared){var pts=[0,40,100,300,1200][cleared]*level;score+=pts;lines+=cleared;
      level=1+(lines/10|0);dropMs=Math.max(90,800-(level-1)*70);upd();}
  }
  function step(soft){
    if(over)return;
    if(!collide(cur,px,py+1)){py++;if(soft)score+=1;}
    else{merge();clearLines();spawn();}
    upd();draw();
  }
  function hardDrop(){if(over)return;while(!collide(cur,px,py+1)){py++;score+=2;}merge();clearLines();spawn();upd();draw();}
  function move(d){if(!over&&!collide(cur,px+d,py)){px+=d;draw();}}

  function blk(g,x,y,c,s){
    var col=COLORS[c];g.fillStyle=col;g.fillRect(x*s,y*s,s,s);
    g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x*s,y*s,s,s*0.18);
    g.fillStyle='rgba(0,0,0,.22)';g.fillRect(x*s,y*s+s*0.82,s,s*0.18);
    g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1;g.strokeRect(x*s+0.5,y*s+0.5,s-1,s-1);
  }
  function draw(){
    bx.clearRect(0,0,cell*COLS,cell*ROWS);
    // 网格背景
    bx.fillStyle='#0b0f18';bx.fillRect(0,0,cell*COLS,cell*ROWS);
    bx.strokeStyle='rgba(255,255,255,.03)';for(var i=1;i<COLS;i++){bx.beginPath();bx.moveTo(i*cell,0);bx.lineTo(i*cell,ROWS*cell);bx.stroke();}
    for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)if(grid[y][x])blk(bx,x,y,grid[y][x],cell);
    if(cur){
      // ghost
      var gy=py;while(!collide(cur,px,gy+1))gy++;
      for(var yy=0;yy<cur.length;yy++)for(var xx=0;xx<cur[yy].length;xx++)if(cur[yy][xx]){
        bx.fillStyle='rgba(255,255,255,.10)';bx.fillRect((px+xx)*cell,(gy+yy)*cell,cell,cell);}
      for(var y2=0;y2<cur.length;y2++)for(var x2=0;x2<cur[y2].length;x2++)if(cur[y2][x2]&&py+y2>=0)blk(bx,px+x2,py+y2,cur[y2][x2],cell);
    }
  }
  function drawNext(){var s=n._c||16;nx.clearRect(0,0,s*4,s*4);var sh=SHAPES[nextK];
    var ox=(4-sh[0].length)/2,oy=(4-sh.length)/2;
    for(var y=0;y<sh.length;y++)for(var x=0;x<sh[y].length;x++)if(sh[y][x])blk(nx,x+ox,y+oy,sh[y][x],s);}

  function loop(t){if(!last)last=t;var dt=t-last;last=t;if(!over){acc+=dt;if(acc>=dropMs){acc=0;step(false);}}requestAnimationFrame(loop);}

  function bind(id,fn){var e=document.getElementById(id);
    e.addEventListener('touchstart',function(ev){ev.preventDefault();fn();},{passive:false});
    e.addEventListener('mousedown',function(ev){ev.preventDefault();fn();});}
  bind('left',function(){move(-1);});bind('right',function(){move(1);});
  bind('rot',function(){if(!over){rotate();draw();}});bind('soft',function(){step(true);});bind('hard',hardDrop);
  document.addEventListener('keydown',function(e){if(over)return;
    if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);
    else if(e.key==='ArrowDown')step(true);else if(e.key==='ArrowUp'){rotate();draw();}else if(e.key===' '){e.preventDefault();hardDrop();}});
  document.getElementById('again').addEventListener('click',reset);
  window.addEventListener('resize',layout);
  reset();requestAnimationFrame(loop);
})();
</script>
</body></html>
